{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card form-card">
      <div class="card-body p-4">
        <h3 class="mb-3">Register</h3>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Register as</label>
            <input type="hidden" name="role" id="roleSelect" value="patient" required>
            <div class="role-toggle d-flex gap-2">
              <button type="button" class="btn role-toggle-btn active flex-fill" data-role="patient" onclick="selectRole('patient')">🧑 Patient<br><small class="fw-normal">Buy Medicines</small></button>
              <button type="button" class="btn role-toggle-btn flex-fill" data-role="seller" onclick="selectRole('seller')">🏥 Seller / Pharmacy<br><small class="fw-normal">Sell Medicines</small></button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" id="passwordInput" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirmPasswordInput" class="form-control" minlength="6" required>
            <p class="small text-danger mb-0 mt-1" id="passwordMismatch" style="display:none;">Passwords do not match</p>
          </div>
          <div class="mb-3" id="shopNameField" style="display:none;">
            <label class="form-label">Pharmacy / Shop Name</label>
            <input type="text" name="shop_name" class="form-control" placeholder="e.g. Sharma Medical Store">
          </div>
          <div class="mb-3" id="shopPhoneField" style="display:none;">
            <label class="form-label">Contact Phone Number</label>
            <input type="tel" name="phone" class="form-control" placeholder="e.g. 98765 43210" pattern="[0-9+\- ]{10,15}">
            <p class="small text-muted mb-0 mt-1">Admin may call this number to verify your pharmacy before approval.</p>
          </div>
          <div class="mb-3" id="shopPhotoField" style="display:none;">
            <label class="form-label">Shop Photo <span class="text-muted">(optional)</span></label>
            <label for="shopPhotoInput" class="upload-box d-block">
              <div id="uploadHint">📷 Click to upload a shop photo (PNG/JPG, max 5MB)</div>
              <img id="imagePreview" alt="Preview">
            </label>
            <input type="file" id="shopPhotoInput" name="shop_photo" accept=".png,.jpg,.jpeg,.webp" class="d-none">
          </div>
          <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const roleSelect = document.getElementById('roleSelect');
const shopField = document.getElementById('shopNameField');
const shopPhoneField = document.getElementById('shopPhoneField');
const shopPhotoField = document.getElementById('shopPhotoField');
function toggleShopField() {
  const isSeller = roleSelect.value === 'seller';
  shopField.style.display = isSeller ? 'block' : 'none';
  shopPhoneField.style.display = isSeller ? 'block' : 'none';
  shopPhotoField.style.display = isSeller ? 'block' : 'none';
}
function selectRole(role) {
  roleSelect.value = role;
  document.querySelectorAll('.role-toggle-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.role === role);
  });
  toggleShopField();
}
toggleShopField();

document.getElementById('shopPhotoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const preview = document.getElementById('imagePreview');
  const hint = document.getElementById('uploadHint');
  if (file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      preview.src = ev.target.result;
      preview.style.display = 'block';
      hint.textContent = '✅ ' + file.name + ' — click to change';
    };
    reader.readAsDataURL(file);
  }
});

const passwordInput = document.getElementById('passwordInput');
const confirmPasswordInput = document.getElementById('confirmPasswordInput');
const mismatchWarning = document.getElementById('passwordMismatch');
const registerForm = passwordInput.closest('form');

function checkPasswordMatch() {
  const mismatch = confirmPasswordInput.value.length > 0 && passwordInput.value !== confirmPasswordInput.value;
  mismatchWarning.style.display = mismatch ? 'block' : 'none';
  confirmPasswordInput.classList.toggle('is-invalid', mismatch);
}
passwordInput.addEventListener('input', checkPasswordMatch);
confirmPasswordInput.addEventListener('input', checkPasswordMatch);

registerForm.addEventListener('submit', function(e) {
  if (passwordInput.value !== confirmPasswordInput.value) {
    e.preventDefault();
    mismatchWarning.style.display = 'block';
    confirmPasswordInput.classList.add('is-invalid');
    confirmPasswordInput.focus();
  }
});
</script>
{% endblock %}
