{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card form-card">
      <div class="card-body p-4">
        <h3 class="mb-3">Add Medicine</h3>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Medicine Photo <span class="text-muted">(optional)</span></label>
            <label for="photoInput" class="upload-box d-block">
              <div id="uploadHint">📷 Click to upload a photo (PNG/JPG, max 5MB)</div>
              <img id="imagePreview" alt="Preview">
            </label>
            <input type="file" id="photoInput" name="photo" accept=".png,.jpg,.jpeg,.webp" class="d-none">
          </div>

          <div class="mb-3">
            <label class="form-label">Medicine Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Generic Name <span class="text-muted">(e.g. Paracetamol)</span></label>
            <input type="text" name="generic_name" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
              <option value="Tablet">Tablet</option>
              <option value="Syrup">Syrup</option>
              <option value="Injection">Injection</option>
              <option value="Ointment">Ointment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Expiry Date</label>
            <input type="date" name="expiry_date" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Original Price (₹)</label>
            <input type="number" step="0.01" name="original_price" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Discount (%)</label>
            <input type="number" step="1" name="discount_percent" class="form-control" value="20" required>
          </div>
          <button class="btn btn-success w-100">Submit for Approval</button>
        </form>
      </div>
    </div>
  </div>
</div>
</div>

<script>
document.getElementById('photoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const preview = document.getElementById('imagePreview');
  const hint = document.getElementById('uploadHint');
  if (file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      preview.src = ev.target.result;
      preview.style.display = 'block';
      hint.textContent = '✅ ' + file.name + ' — click to change';
    };
    reader.readAsDataURL(file);
  }
});
</script>
{% endblock %}
